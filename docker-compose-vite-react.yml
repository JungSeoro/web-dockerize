version: '3.5'

services:
  react:
    container_name: react
    image: node:${NODE_VERSION}
    stdin_open: true
    tty: true
    ports:
      - '3000:5173'
    volumes:
      - ../:/vol
    working_dir: /vol
    command: >
      sh -c "npm config set strict-ssl false
      && npm install
      && npm run dev -- --host 0.0.0.0 --port 5173"
